# ═══════════ বিদ্যুৎ মনিটর — nginx সাইট ═══════════
# ফ্রন্টএন্ড (dist) সার্ভ করে, /api/ কে পাইথন ব্যাকএন্ডে পাঠায়।
# সক্রিয় করতে:
#   sudo cp server/nginx-bijli.conf /etc/nginx/sites-available/bijli
#   sudo ln -sf /etc/nginx/sites-available/bijli /etc/nginx/sites-enabled/bijli
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl restart nginx
#
# (install.sh এই কাজগুলো নিজেই করে + __WEB_DIR__ বসিয়ে দেয়)

server {
    listen 80;
    listen [::]:80;
    server_name _;                      # ডোমেইন থাকলে এখানে বসান, যেমন bijli.example.com

    root __WEB_DIR__;                   # dist ফোল্ডারের কনটেন্ট (যেমন /var/www/bijli)
    index index.html;

    charset utf-8;
    client_max_body_size 1m;

    # ── API → পাইথন ব্যাকএন্ড (127.0.0.1:8000) ──
    # trailing slash ছাড়া proxy_pass — পুরো /api/xxx পাথ অটুট থাকে,
    # handler.py তারপর path suffix দেখে route ঠিক করে (data/config/notify/...)
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    25s;      # Tuya/Telegram কলের জন্য একটু বেশি
    }

    # ── হ্যাশ-করা স্ট্যাটিক অ্যাসেট (immutable ক্যাশ) ──
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Service Worker / manifest সর্বদা ফ্রেশ ──
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ── SPA fallback (বাকি সব রুট index.html-এ) ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip — ছোট ডাউনলোড
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 512;
}